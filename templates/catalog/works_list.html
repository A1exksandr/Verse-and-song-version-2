{% extends "base.html" %}

{% block title %}Произведения{% endblock %}

{% block content %}
<section>
  <h1 class="section-title">Произведения</h1>

  <div class="items-grid">
    {% for work in works %}
      <div class="item-card">
        <div class="item-image">
          {% if work.image %}
            <img src="{{ work.image.url }}" alt="{{ work.title }}">
          {% else %}
            <img src="https://placehold.co/400x400/f8e2cf/333333?text={{ work.title }}" alt="{{ work.title }}">
          {% endif %}
        </div>

        <h3 class="item-title">
          <a href="{% url 'catalog:work_detail' work.slug %}">{{ work.title }}</a>
        </h3>

        <p class="item-subtitle">
          <a href="{% url 'catalog:author_detail' work.author.slug %}">
            {{ work.author.name }}
          </a>
        </p>
      </div>
    {% empty %}
      <p>Произведения пока не добавлены.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
